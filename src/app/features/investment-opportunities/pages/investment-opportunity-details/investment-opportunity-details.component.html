<section class="investment-opportunity-details-area">
    <div class="container">
        <div class="text-center py-5" *ngIf="isLoading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="alert alert-danger text-center" *ngIf="!isLoading && errorMessage">
            {{ errorMessage }}
        </div>

        <div *ngIf="!isLoading && opportunity">
            <div class="details-header">
                <img [src]="getImageUrl(opportunity)" [alt]="opportunity.title" class="main-img" *ngIf="getImageUrl(opportunity)" appImageFallback>
                <h1>{{ opportunity.title }}</h1>
            </div>

            <div class="content-wrapper">
                <div class="content-section" *ngIf="opportunity.description">
                    <h3>{{ 'DESCRIPTION' | translate }}</h3>
                    <div [innerHTML]="opportunity.description"></div>
                </div>
            </div>

            <div class="back-btn-container">
                <a routerLink="/investment-opportunities" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                    {{ 'BACK_TO_OPPORTUNITIES' | translate }}
                </a>
            </div>
        </div>
    </div>
</section>
