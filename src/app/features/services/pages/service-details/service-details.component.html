<section class="service-details-area">
    <div class="container">
        <div class="text-center py-5" *ngIf="isLoading">
            <div class="spinner-grow text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="alert alert-danger text-center" *ngIf="!isLoading && errorMessage">
            {{ errorMessage | translate }}
        </div>

        <div *ngIf="!isLoading && service" class="details-card">
            <div class="img-container" *ngIf="getImageUrl(service)">
                <img [src]="getImageUrl(service)" [alt]="service.title" appImageFallback>
                <div class="overlay"></div>
                <div class="title-wrapper">
                    <div class="badges" *ngIf="service.status !== undefined">
                        <div class="status-badge mb-3" [class.active]="service.status === 1">
                            <i class="fa-solid" [ngClass]="service.status === 1 ? 'fa-check-circle' : 'fa-clock'"></i>
                            {{ service.status === 1 ? ('ACTIVE' | translate) : ('INACTIVE' | translate) }}
                        </div>
                    </div>
                    <h1>{{ service.title }}</h1>
                </div>
            </div>

            <div class="title-block" *ngIf="!getImageUrl(service)">
                <h1>{{ service.title }}</h1>
            </div>

            <div class="content-container" *ngIf="service.description">
                <div [innerHTML]="service.description"></div>
            </div>

            <div class="actions">
                <a routerLink="/services" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                    {{ 'BACK_TO_SERVICES' | translate }}
                </a>
            </div>
        </div>
    </div>
</section>
