<section class="post-details-area">
    <div class="container">
        <div class="text-center py-5" *ngIf="isLoading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="alert alert-danger text-center" *ngIf="!isLoading && errorMessage">
            {{ errorMessage | translate }}
        </div>

        <div *ngIf="!isLoading && post">
            <div class="details-header">
                <img [src]="getImageUrl(post)" [alt]="post.title" class="main-img" *ngIf="getImageUrl(post)" appImageFallback>
                <h1>{{ post.title }}</h1>
            </div>

            <div class="content-wrapper">
                <div class="content-section" *ngIf="post.description">
                    <div [innerHTML]="post.description"></div>
                </div>
            </div>

            <div class="back-btn-container">
                <a routerLink="/posts" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                    {{ 'BACK_TO_LIST' | translate }}
                </a>
            </div>
        </div>
    </div>
</section>
