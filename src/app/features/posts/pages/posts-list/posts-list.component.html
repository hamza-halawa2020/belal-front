<section class="posts-area">
    <div class="container">
        <div class="section-title text-center">
            <h2>{{ 'POSTS' | translate }}</h2>
            <p>{{ 'POSTS_DESC' | translate }}</p>
        </div>

        <div class="alert alert-danger text-center" *ngIf="errorMessage">
            {{ errorMessage | translate }}
        </div>

        <div class="row" *ngIf="isLoading">
            <div class="col-lg-4 col-md-6 mb-4" *ngFor="let item of [1,2,3,4,5,6]">
                <div class="skeleton-loader"></div>
            </div>
        </div>

        <div class="row" *ngIf="!isLoading">
            <div class="col-lg-4 col-md-6 col-sm-12 mb-4" *ngFor="let post of posts">
                <app-content-card
                    [item]="post"
                    [routePath]="'/posts'">
                </app-content-card>
            </div>

            <div class="col-12 text-center py-5" *ngIf="!errorMessage && posts.length === 0">
                <div class="alert alert-info">
                    {{ 'NO_POSTS_FOUND' | translate }}
                </div>
            </div>
        </div>

        <app-pagination [meta]="meta" (pageChange)="onPageChange($event)"></app-pagination>
    </div>
</section>
