<section class="team-area">
    <div class="container">
        <div class="section-title text-center">
            <h2>{{ 'OUR_PROFESSIONAL_TEAM' | translate }}</h2>
            <p>{{ 'TEAM_DESC' | translate }}</p>
        </div>

        <div class="alert alert-danger text-center" *ngIf="errorMessage">
            {{ errorMessage }}
        </div>

        <div class="row" *ngIf="isLoading">
            <div class="col-lg-4 col-md-6 mb-4" *ngFor="let item of [1,2,3,4,5,6]">
                <div class="skeleton-loader"></div>
            </div>
        </div>

        <section class="staff-area">
            <div class="row" *ngIf="!isLoading">
                <div class="col-lg-4 col-md-6 col-sm-12 mb-4" *ngFor="let member of staff">
                    <div class="staff-card">
                        <div class="staff-image" *ngIf="getImageUrl(member)">
                            <img [src]="getImageUrl(member)" [alt]="member.name" appImageFallback>
                        </div>
                        <div class="staff-info">
                            <h3>{{ member.name }}</h3>
                            <p class="job-title">{{ member.job_title || member.position }}</p>
                        </div>
                    </div>
                </div>

                <div class="col-12 text-center py-5" *ngIf="!errorMessage && staff.length === 0">
                    <div class="alert alert-info">
                        <i class="fa-solid fa-info-circle"></i>
                        {{ 'NO_STAFF_FOUND' | translate }}
                    </div>
                </div>
            </div>

            <app-pagination [meta]="meta" (pageChange)="onPageChange($event)" *ngIf="!isLoading && meta"></app-pagination>
        </section>
    </div>
</section>
